<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Acquisition Infrastructure</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            max-width: 400px;
            text-align: center;
            border: 1px solid #334155;
            padding: 30px;
            border-radius: 12px;
            background-color: #1e293b;
        }
        h1 { font-size: 24px; color: #38bdf8; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.5; }
        .badge {
            background-color: #0369a1;
            color: #e0f2fe;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="badge">SYSTEM READY</span>
        <h1>Infrastructure Demo</h1>
        <p>This layout is built for rapid mobile lead interception. Testing active.</p>
    </div>
</body>
</html>
